<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Splash — Stage 4</title>
  <link rel="stylesheet" href="../../../../DesignSystem/tokens/tokens.css" />
  <link rel="stylesheet" href="../../../../DesignSystem/components/base.css" />
  <style>
    .splash-logo {
      width: 96px;
      height: 96px;
      border-radius: var(--radius-xl);
      background: var(--color-primary);
      color: var(--color-text-on-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-lg);
    }
    .splash-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-6);
      text-align: center;
      padding-inline: var(--space-6);
    }
    .splash-brand { margin: 0; }
    .splash-banner {
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-4);
      max-width: 320px;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="ds-screen">
    <div class="ds-toolbar-row">
      <button class="ds-demo-toggle" id="theme-toggle" type="button">Dark / Light</button>
      <button class="ds-demo-toggle" id="dir-toggle" type="button">RTL / LTR</button>
    </div>

    <main class="splash-center">
      <div class="splash-logo">
        <ds-icon name="logo" size="48"></ds-icon>
      </div>

      <div class="ds-stack" style="align-items:center;">
        <h1 class="ds-text-title splash-brand" id="brand-title">…</h1>
        <p class="ds-text-body" id="status-text">…</p>
      </div>

      <ds-loading-overlay id="loader"></ds-loading-overlay>

      <p class="splash-banner" id="offline-banner" hidden></p>

      <ds-button id="retry-btn" variant="secondary" hidden>…</ds-button>
    </main>
  </div>

  <script type="module" src="./splash.js"></script>
</body>
</html>
