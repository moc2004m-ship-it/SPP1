<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Authentication</title><style>body{font-family:system-ui;margin:0;padding:24px;max-width:520px;margin:auto}button,input{font:inherit;padding:12px;margin:6px 0;width:100%;box-sizing:border-box}fieldset{margin:12px 0}</style></head><body><h1 data-i18n="auth.title">تسجيل الدخول</h1><p data-i18n="auth.consent">بالمتابعة توافق على الشروط والخصوصية.</p><fieldset><legend>Phone + OTP</legend><input id="phone" placeholder="+213..." autocomplete="tel"><button id="send">إرسال رمز</button><input id="otp" inputmode="numeric" maxlength="6" placeholder="رمز التحقق"><input id="consent" value="1.0" placeholder="Consent version"><button id="verify">تحقق وإنشاء الحساب</button></fieldset><p id="status" role="status"></p><script src="auth.js"></script></body></html>
